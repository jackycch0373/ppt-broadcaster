<!DOCTYPE html>
<html>
<head>
    <title>Live Presentation - Room {{ROOM_ID}}</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            body, html {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                background-color: #1a1a1a;
                color: #ffffff;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                overflow: hidden;     
            }

            /* Main Content Container */
            .content-wrapper {
                text-align: center;
                width: 95%;
                max-width: 1200px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }

            /* Slide Image Styling */
            #slide {
                max-width: 100%;
                max-height: 90vh; /* Scaled to fit screen height */
                box-shadow: 0 10px 50px rgba(0,0,0,0.8);
                border-radius: 8px;
                display: none; /* Hidden until first slide loads */
                transition: opacity 0.5s ease-in-out;
            }

            /* Waiting Message Styling */
            #msg {
                font-size: 1.5rem;
                font-weight: 300;
                padding: 20px;
                border: 1px solid #444;
                border-radius: 10px;
                background: rgba(255,255,255,0.05);
            }

            /* History Bar Styling */
            .history-bar {
            width: 100%; height: 150px;
            background: rgba(0,0,0,0.5);
            display: flex; overflow-x: auto; /* Horizontal scroll */
            padding: 10px; gap: 10px;
            border-top: 1px solid #333;
            }

            .thumb-container {
            flex: 0 0 auto; height: 100%; cursor: pointer;
            border: 2px solid transparent; transition: 0.2s;
            }
            .thumb-container:hover { border-color: #00d2ff; }
            .thumb-container img { height: 100%; border-radius: 4px; }
            .thumb-label { font-size: 10px; text-align: center; color: #888; }
                    
            img { max-width:100%; max-height:100%; }
        </style>
</head>
<body>
    <div class="content-wrapper">
        <div id="msg">Waiting for the presenter to start...</div>
        <img id="slide" alt="Current Slide" />
    </div>
    <div class="history-bar" id="historyBar"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io({ forceNew: true });
        const roomId = "{{ROOM_ID}}";
        const historyBar = document.getElementById('historyBar');
        const mainSlide = document.getElementById('slide');
        const msg = document.getElementById('msg');
        socket.on('connect', () => { socket.emit('join_room', roomId); });

        // Load existing history when joining
        socket.on('init_history', (history) => {
            historyBar.innerHTML = ""; // Clear
            history.forEach((imgData, index) => addThumbnail(imgData, index));
            if(history.length > 0) showSlide(history[history.length - 1]);
        });

        // Handle live updates
        socket.on('slide_update', (data) => {
            addThumbnail(data.image, data.index);
            showSlide(data.image);
        });

        function addThumbnail(imgData, index) {
            msg.style.display = 'none';
            const container = document.createElement('div');
            container.className = 'thumb-container';
            container.onclick = () => showSlide(imgData);
            
            container.innerHTML = `
                <img src="${imgData}" />
                <div class="thumb-label">Slide ${index + 1}</div>
            `;
            historyBar.appendChild(container);
            
            // Auto-scroll to the end of history
            historyBar.scrollLeft = historyBar.scrollWidth;
        }

        function showSlide(imgData) {
            mainSlide.src = imgData;
            mainSlide.style.display = 'block';
        }

        socket.on('status_update', (msg) => {
            // Show a message overlay or alert
            const msgDiv = document.getElementById('msg');
            msgDiv.innerText = msg;
            msgDiv.style.display = 'block';
            document.getElementById('slide').style.opacity = '0.3';
        });

        socket.on('redirect_home', () => { window.location.href = '/'; });

    </script>
</body>
</html>
